<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание на сегодня</title>
<!-- Число в ?v= — метка версии. Меняйте его при каждой правке
     tv.css, parse.js, diff.js или tv.js, иначе телевизор возьмёт файлы
     из кеша. То же число — в VERSION в начале tv.js. -->
<link rel="stylesheet" href="tv.css?v=35">
<!--
  Табло для телевизора в холле. Открывать в браузере на весь экран (F11).
  Каталог самостоятельный: расписания берутся из ../s/, список из ../list.txt.
  Параметры в адресе:
    tv.html?dark       — тёмная тема, если в холле темно и белый экран слепит
    tv.html?safe=5     — поля в процентах от экрана, если телевизор режет
                         края; задав его, получите такие поля со всех сторон
    tv.html?safetop=32 — поле сверху в пикселях (по умолчанию 0 — впритык)
    tv.html?safebot=32 — поле снизу в пикселях (по умолчанию 10)
    tv.html?safex=24   — поле слева и справа в пикселях (по умолчанию 10)
    tv.html?split=40   — нижняя граница высоты строки, при которой занятие
                         по подгруппам разрешено разворачивать на две строки
                         (по умолчанию 24 физических пикселя, 0 — разрешать
                         всегда). Разворачиваются только те ячейки, где имена
                         в одну строку не поместились.
    tv.html?groups=8   — сколько групп в одной полосе, если автоподбор не угадал
    tv.html?bands=2    — на сколько полос переносить таблицу
    tv.html?bleed=92   — вытянуть страницу за края экрана на 92 пикселя
                         (лечит поля, которые телевизор оставляет под оверскан)
    tv.html?bleedy=48  — то же сверху и снизу
    tv.html?noticker   — не показывать бегущую строку
    tv.html?tickspeed=90 — скорость бегущей строки, физических пикселей
                         в секунду (по умолчанию 140)
    tv.html?nodiff     — не отмечать изменения расписания
    tv.html?rebase     — принять сегодняшние файлы за исходный вариант
                         недели и считать изменения заново (нужно, если
                         в точку отсчёта попала заведомо кривая выгрузка);
                         срабатывает один раз за загрузку страницы
    tv.html?diag       — справка поверх таблицы: откуда табло ведёт отсчёт
                         изменений и почему пометок нет

  Бегущая строка. Объявления лежат в ../ticker.txt — рядом с list.txt и в
  том же виде: одна строка — одна запись, поля через палку.

      тип|срок|текст

  тип   — t обычное объявление, ! важное (выделяется красным);
  срок  — когда показывать; пусто — всегда: «до 10.09» (по 10 сентября
          включительно), «с 08.09», «с 08.09 до 12.09», «10.09» (только
          в этот день). Год необязателен — берётся ближайший.
  текст — всё остальное до конца строки; палки внутри него разрешены.

  Пустые строки и строки с # пропускаются, строка без палок целиком
  считается обычным объявлением. Файла может не быть вовсе — тогда полосы
  внизу нет и её высоту забирает таблица. Кодировка любая из двух: UTF-8
  или windows-1251, как и у расписаний.

  Изменения расписания. Первая версия каждого учебного дня, которую увидело
  табло, запоминается в браузере; дальше изменившиеся и добавленные пары
  пульсируют зелёным, снятые — красным. В прошедших днях пометки остаются,
  но не пульсируют. Точка отсчёта хранится в этом браузере и только в нём:
  если очистить его данные, отсчёт пойдёт от текущих файлов.
  Настройки по умолчанию — в начале tv.js.
-->
</head>
<body>

<header class="bar">
  <div class="bar__left">
    <p class="bar__day" id="day">Загрузка</p>
    <p class="bar__date" id="date"></p>
  </div>

  <span class="bar__gerb" aria-hidden="true"></span>

  <!-- Надпись об ошибке стоит слева от часов, а не в середине полосы:
       середина отдана гербу. -->
  <div class="bar__right">
    <p class="bar__note" id="note"></p>
    <p class="clock" id="clock">--:--</p>
  </div>
</header>

<main class="board" id="board"></main>

<!-- Бегущая строка: содержимое кладёт сюда tv.js, разметки заранее нет.
     Высота задана в tv.css (.ticker), таблица пересчитывает свободное
     пространство сама. -->
<footer class="ticker" id="ticker"></footer>

<script src="parse.js?v=35" defer></script>
<script src="diff.js?v=35" defer></script>
<script src="tv.js?v=35" defer></script>
</body>
</html>
